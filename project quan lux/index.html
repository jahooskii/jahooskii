<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quan Lux" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Quan Lux Luxury Chauffeur Management Dashboard - Enterprise fleet and client management solution" />
    <meta name="keywords" content="chauffeur, luxury service, fleet management, booking system" />
    <meta property="og:title" content="Quan Lux Chauffeur Dashboard" />
    <meta property="og:description" content="Professional luxury chauffeur and fleet management system" />
    <meta property="og:type" content="website" />
    
    <title>Quan Lux - Luxury Chauffeur Dashboard</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23FDB026' text-anchor='middle' font-family='Arial'>Q</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='110' font-size='100' font-weight='bold' fill='%23FDB026' text-anchor='middle' font-family='Arial'>Q</text></svg>" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, select {
        -webkit-user-select: text;
        user-select: text;
      }
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        background-color: #000;
        color: #fff;
      }
      #root {
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      @supports (padding: max(0px)) {
        body {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
